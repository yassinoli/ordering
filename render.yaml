services:
  - type: web
    name: orderflow
    runtime: node
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    disk:
      name: orderflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/orders.db
      - key: JWT_SECRET
        generateValue: true
