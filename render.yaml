services:
  - type: web
    name: orderflow
    runtime: node
    buildCommand: cd backend && npm ci
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    disk:
      name: orderflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/orders.db
      - key: JWT_SECRET
        generateValue: true
